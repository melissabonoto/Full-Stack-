<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Cadastrar carro</title>
        <link href="style.css" rel="stylesheet">
    </head>

    <body>
        <h1>Cadastrar carro</h1>

            <div class="divform"> 
                <form action="/cadastrar_carro" method="get">
                    <p>Marca: <input type="text" name="marca"></p>
                    <p>Modelo: <input type="text" name="modelo"> </p>
                    <p>Ano: <input type="number" name="ano"> </p>
                    <p>Quantidade disponível: <input type="number" name="qtde"> </p>
                    <input type="submit" value="Cadastrar" id="button3"> 
                </form>
            </div>

    </body>
</html>
